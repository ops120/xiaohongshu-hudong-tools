name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate Python syntax
        run: python -m compileall -q collect.py reply.py like.py search.py cover_utils.py privacy.py exceptions.py exception_map.py sort_utils.py
      - name: Validate public JSON configuration
        run: python -m json.tool config.example.json > /dev/null
      - name: Lint critical errors
        run: ruff check --select E9,F63,F7,F82 collect.py reply.py like.py search.py cover_utils.py privacy.py exceptions.py exception_map.py sort_utils.py
